name: Validate CUDA ML Research Lab

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  cpu-references-and-packaging:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install CPU test and build dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install torch --index-url https://download.pytorch.org/whl/cpu
          python -m pip install pytest build twine numpy scikit-learn

      - name: Validate CPU references and public CPU dispatch
        env:
          PYTHONPATH: decode_kernels
        run: python -m pytest -q decode_kernels/tests/test_references.py

      - name: Build and inspect root source distribution
        if: matrix.python-version == '3.11'
        run: |
          python -m build --sdist
          twine check dist/*.tar.gz

      - name: Upload source distribution
        if: matrix.python-version == '3.11'
        uses: actions/upload-artifact@v4
        with:
          name: source-distribution
          path: dist/*.tar.gz

  cuda-validation-contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Verify Modal runner and trace schema are tracked
        run: |
          test -f modal/run_decode_gpu.py
          test -f decode_kernels/benchmarks/decode_traces.json
          python -m json.tool decode_kernels/benchmarks/decode_traces.json >/dev/null

      - name: Explain GPU validation boundary
        run: |
          echo "CUDA compilation, correctness, opcheck, torch.compile, and CUDA Graph tests run through the authenticated Modal A10G runner."
          echo "The latest machine-readable run is artifacts/modal_a10g_decode_validation.json."

# Publishing is intentionally absent. The repository does not yet have a
# coherent binary-wheel/architecture policy, and CPU-built wheels must not be
# presented as validated CUDA distributions.
